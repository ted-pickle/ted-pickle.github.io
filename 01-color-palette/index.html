<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컬러 팔레트 실험실</title>
<meta name="description" content="색상환, 배색, 계절 톤, 강조, 색의 대비를 직접 실험하는 도구">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --bg: #fffcf7; --ink: #4a3527; --muted: #8f7766; --line: #eee4d7; --card: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; word-break: keep-all; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .top a { font-size: 14px; color: var(--muted); text-decoration: none; }
  h1 { margin: 18px 0 6px; font-size: 34px; letter-spacing: -.03em; }
  .sub { margin: 0 0 28px; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 330px 1fr; gap: 28px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .panel + .panel { margin-top: 16px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .seg button:hover { border-color: var(--muted); }
  .seg button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .hint { margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
  #wheel { width: 100%; display: block; cursor: pointer; }
  #wheel .wedge { transition: opacity .2s; }
  #wheel .wedge:hover { opacity: .8; }
  .shuffle { margin-top: 14px; width: 100%; border: 0; border-radius: 10px; padding: 13px; background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .shuffle kbd { font-family: inherit; opacity: .6; font-size: 12px; margin-left: 6px; }

  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); height: 300px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px -28px rgba(80,45,20,.5); }
  .sw { position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; cursor: pointer; transition: background .5s; }
  .sw .hex { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
  .sw .meta { font-size: 12.5px; opacity: .8; margin-top: 3px; }
  .sw .lock { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255,255,255,.25); color: inherit; display: grid; place-items: center; }
  .sw .lock svg { width: 16px; height: 16px; }
  .sw .lock.on { background: rgba(255,255,255,.85); color: #4a3527; }
  .sw .copied { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; opacity: 0; transition: opacity .2s; }
  .sw.flash .copied { opacity: 1; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .poster { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; transition: background .5s; }
  .poster .p-shape { position: absolute; transition: background .5s; }
  .poster .p-title { position: absolute; left: 7%; top: 9%; font-size: clamp(20px, 2.4vw, 30px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .poster .p-btn { position: absolute; left: 7%; bottom: 9%; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: background .5s; }
  .ratio { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 12px 0 6px; }
  .ratio div { transition: background .5s; }
  .ratio-lab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
  .mini { border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; float: right; margin-top: -4px; }
  .lab-view { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 2 / 1; margin-top: 12px; }
  .lab-view .bgc { display: grid; place-items: center; transition: background .5s; }
  .lab-view .sq { width: 30%; aspect-ratio: 1; transition: background .5s; }
  .bridge { position: absolute; left: 35%; right: 35%; top: 50%; height: 16%; transform: translateY(-50%); opacity: 0; transition: opacity .4s; pointer-events: none; }
  .bridge.on { opacity: 1; }
  .lab-text { margin: 12px 0 0; font-size: 14px; line-height: 1.7; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  @media (max-width: 900px) {
    .layout, .row2 { grid-template-columns: 1fr; }
    .swatches { height: 220px; }
    .sw { padding: 10px; } .sw .hex { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">← 포트폴리오로</a><span class="hint" style="margin:0">스페이스바: 다시 뽑기 · 색 클릭: 코드 복사</span></div>
  <h1>컬러 팔레트 실험실</h1>
  <p class="sub">미술 시간에 배운 배색과 대비를 직접 만들어 보고 확인합니다.</p>

  <div class="layout">
    <aside>
      <div class="panel">
        <h2>1. 색상환에서 기준색 고르기</h2>
        <svg id="wheel" viewBox="-120 -120 240 240"></svg>
        <p class="hint" id="wheel-hint"></p>
      </div>
      <div class="panel">
        <h2>2. 배색 방법</h2>
        <div class="seg" id="modes">
          <button data-v="comp" class="on">보색</button>
          <button data-v="anal">유사색</button>
          <button data-v="tone">톤온톤</button>
        </div>
        <p class="hint" id="mode-hint"></p>
      </div>
      <div class="panel">
        <h2>3. 계절 톤</h2>
        <div class="seg" id="seasons">
          <button data-v="none" class="on">기본</button>
          <button data-v="spring">봄</button>
          <button data-v="summer">여름</button>
          <button data-v="autumn">가을</button>
          <button data-v="winter">겨울</button>
        </div>
        <p class="hint" id="season-hint"></p>
        <button class="shuffle" id="shuffle">다시 뽑기<kbd>Space</kbd></button>
      </div>
    </aside>

    <main>
      <div class="swatches" id="swatches"></div>
      <div class="row2">
        <div class="panel">
          <h2>강조: 70 / 25 / 5 <button class="mini" id="swap">역할 바꾸기</button></h2>
          <div class="poster" id="poster">
            <div class="p-shape" id="ps1"></div><div class="p-shape" id="ps2"></div>
            <div class="p-title" id="ptitle">우리 학교<br>미술 전시회</div>
            <div class="p-btn" id="pbtn">관람하기</div>
          </div>
          <div class="ratio"><div id="r1" style="width:70%"></div><div id="r2" style="width:25%"></div><div id="r3" style="width:5%"></div></div>
          <div class="ratio-lab"><span>주조색 70%</span><span>보조색 25%</span><span>강조색 5%</span></div>
        </div>
        <div class="panel">
          <h2>색의 대비 실험</h2>
          <div class="seg" id="labs">
            <button data-v="value" class="on">명도대비</button>
            <button data-v="chroma">채도대비</button>
            <button data-v="hue">색상대비</button>
            <button data-v="comp">보색대비</button>
          </div>
          <div class="lab-view"><div class="bgc" id="lb1"><div class="sq" id="ls1"></div></div><div class="bgc" id="lb2"><div class="sq" id="ls2"></div></div><div class="bridge" id="bridge"></div></div>
          <label class="check"><input type="checkbox" id="bridge-on"> 가운데 두 색을 이어서 같은 색인지 확인하기</label>
          <p class="lab-text" id="lab-text"></p>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const NAMES = ['빨강', '주황', '노랑', '연두', '초록', '청록', '하늘', '파랑', '남색', '보라', '자주', '분홍'];
const MODE_HINT = {
  comp: '보색: 색상환에서 서로 마주 보는 두 색입니다. 함께 쓰면 서로를 더 또렷하게 만듭니다.',
  anal: '유사색: 색상환에서 이웃한 색끼리 모은 배색입니다. 자연스럽고 편안한 느낌을 줍니다.',
  tone: '톤온톤: 한 가지 색상 안에서 밝기만 바꾼 배색입니다. 통일감이 가장 강합니다.'
};
const SEASON = {
  none:   { s: [40, 80], l: [30, 80], hint: '계절 톤을 고르면 채도와 명도의 범위가 바뀝니다.' },
  spring: { s: [55, 85], l: [62, 82], warm: true, hint: '봄: 밝고 선명한 따뜻한 색. 새싹과 꽃처럼 가볍고 생기 있는 느낌입니다.' },
  summer: { s: [22, 45], l: [66, 86], cool: true, hint: '여름: 밝지만 부드럽고 차가운 색. 물빛처럼 시원하고 차분합니다.' },
  autumn: { s: [35, 60], l: [28, 52], warm: true, hint: '가을: 어둡고 차분한 따뜻한 색. 낙엽과 흙처럼 깊은 느낌입니다.' },
  winter: { s: [55, 88], l: [18, 42], cool: true, hint: '겨울: 진하고 선명한 차가운 색. 명도 차이가 커서 대비가 강합니다.' }
};
const LAB = {
  value: '명도대비: 같은 색도 어두운 바탕 위에서는 더 밝게, 밝은 바탕 위에서는 더 어둡게 보입니다.',
  chroma: '채도대비: 같은 색도 탁한 회색 바탕 위에서는 더 선명하게, 선명한 바탕 위에서는 더 탁하게 보입니다.',
  hue: '색상대비: 같은 색도 바탕색에 따라 색상이 다르게 보입니다. 바탕색과 반대 방향으로 밀려나 보입니다.',
  comp: '보색대비: 보색 바탕 위에 놓으면 회색 바탕 위보다 훨씬 선명하고 강하게 보입니다.'
};
const LOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>';
const UNLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 014.8-1"/></svg>';

let mode = 'comp', season = 'none', lab = 'value';
let base = 200;                  // 기준 색상 (0~359)
let colors = [];                 // {h, s, l}
let locked = [false, false, false, false, false];
let roleShift = 0;
let baseFixed = false;           // 색상환에서 직접 고른 기준색은 다시 뽑아도 유지

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const wrapH = h => ((h % 360) + 360) % 360;
const css = c => `hsl(${c.h.toFixed(0)} ${c.s.toFixed(0)}% ${c.l.toFixed(0)}%)`;
function hex(c) {
  const s = c.s / 100, l = c.l / 100;
  const f = n => { const k = (n + c.h / 30) % 12, a = s * Math.min(l, 1 - l);
    return Math.round((l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255).toString(16).padStart(2, '0'); };
  return ('#' + f(0) + f(8) + f(4)).toUpperCase();
}
const hueName = h => NAMES[Math.round(wrapH(h) / 30) % 12];
const temp = h => { h = wrapH(h); return (h < 75 || h >= 330) ? '따뜻한 색' : (h >= 165 && h < 285) ? '차가운 색' : '중성색'; };
const textOn = c => c.l > 62 ? '#3b2a1f' : '#ffffff';

/* 팔레트 만들기 */
function generate(newBase) {
  const S = SEASON[season];
  if (newBase) {
    if (S.warm) base = wrapH(rand(-30, 70));
    else if (S.cool) base = rand(170, 290);
    else base = rand(0, 360);
  }
  const L = S.l, Sat = S.s;
  let plan;
  if (mode === 'comp') plan = [0, 0, 180, 180, 0];
  else if (mode === 'anal') plan = [-30, -15, 0, 15, 30];
  else plan = [0, 0, 0, 0, 0];
  const steps = [0, .25, .5, .75, 1];
  const order = mode === 'comp' ? [.85, .35, .7, .2, 1] : (mode === 'tone' ? steps : [.8, .55, .3, .65, .1]);
  colors = plan.map((d, i) => {
    if (locked[i] && colors[i]) return colors[i];
    return {
      h: wrapH(base + d + rand(-4, 4)),
      s: mode === 'tone' ? rand(Sat[0], Sat[1]) * (0.85 + 0.3 * steps[i]) : rand(Sat[0], Sat[1]),
      l: L[0] + (L[1] - L[0]) * order[i] + rand(-3, 3)
    };
  });
  render();
}

/* 그리기 */
function render() {
  // 팔레트
  const box = $('swatches');
  box.innerHTML = '';
  colors.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'sw';
    d.style.background = css(c);
    d.style.color = textOn(c);
    d.innerHTML = `<button class="lock ${locked[i] ? 'on' : ''}" title="고정">${locked[i] ? LOCK : UNLOCK}</button>
      <div class="hex">${hex(c)}</div><div class="meta">${hueName(c.h)} · ${temp(c.h)}</div><div class="copied">복사됨</div>`;
    d.onclick = e => {
      if (e.target.closest('.lock')) { locked[i] = !locked[i]; render(); return; }
      navigator.clipboard?.writeText(hex(c));
      d.classList.add('flash'); setTimeout(() => d.classList.remove('flash'), 700);
    };
    box.appendChild(d);
  });
  drawWheel();
  drawPoster();
  drawLab();
  $('mode-hint').textContent = MODE_HINT[mode];
  $('season-hint').textContent = SEASON[season].hint;
  $('wheel-hint').textContent = `기준색: ${hueName(base)} (${temp(base)}). 색상환을 눌러 기준색을 바꿀 수 있습니다.`;
}

function drawWheel() {
  const svg = $('wheel');
  let html = '';
  const R = 100, r = 62;
  for (let i = 0; i < 12; i++) {
    const a0 = (i * 30 - 15 - 90) * Math.PI / 180, a1 = (i * 30 + 15 - 90) * Math.PI / 180;
    const p = (a, rr) => `${(Math.cos(a) * rr).toFixed(2)} ${(Math.sin(a) * rr).toFixed(2)}`;
    html += `<path class="wedge" data-h="${i * 30}" d="M${p(a0, r)} L${p(a0, R)} A${R} ${R} 0 0 1 ${p(a1, R)} L${p(a1, r)} A${r} ${r} 0 0 0 ${p(a0, r)}Z" fill="hsl(${i * 30} 75% 55%)" stroke="#fff" stroke-width="1.5"><title>${NAMES[i]}</title></path>`;
  }
  const pos = (h, rr) => { const a = (h - 90) * Math.PI / 180; return [Math.cos(a) * rr, Math.sin(a) * rr]; };
  // 배색 관계 표시
  if (mode === 'comp') {
    const [x1, y1] = pos(base, 81), [x2, y2] = pos(base + 180, 81);
    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4a3527" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  } else if (mode === 'anal') {
    const a0 = (base - 30 - 90) * Math.PI / 180, a1 = (base + 30 - 90) * Math.PI / 180;
    html += `<path d="M${Math.cos(a0) * 110} ${Math.sin(a0) * 110} A110 110 0 0 1 ${Math.cos(a1) * 110} ${Math.sin(a1) * 110}" fill="none" stroke="#4a3527" stroke-width="3" stroke-linecap="round"/>`;
  }
  colors.forEach(c => {
    const [x, y] = pos(c.h, 81);
    html += `<circle cx="${x}" cy="${y}" r="7" fill="${css(c)}" stroke="#fff" stroke-width="2.5"/>`;
  });
  html += `<circle r="50" fill="${css({ h: base, s: 70, l: 55 })}"/><text y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">${hueName(base)}</text>`;
  svg.innerHTML = html;
  svg.querySelectorAll('.wedge').forEach(w => w.onclick = () => { base = +w.dataset.h; baseFixed = true; locked = locked.map(() => false); generate(false); });
}

function drawPoster() {
  // 밝은 색을 주조색, 가장 선명한 색을 강조색으로 고르고, 역할 바꾸기로 순서를 돌립니다
  const byL = colors.map((c, i) => i).sort((a, b) => colors[b].l - colors[a].l);
  const accentIdx = colors.map((c, i) => i).filter(i => i !== byL[0]).sort((a, b) => colors[b].s - colors[a].s)[0];
  const rest = byL.filter(i => i !== byL[0] && i !== accentIdx);
  const order = [byL[0], rest[0], accentIdx, rest[1], rest[2]];
  const roles = [0, 1, 2].map(k => order[(k + roleShift) % 5]);
  const [m, s, a] = roles.map(i => colors[i]);
  $('poster').style.background = css(m);
  $('ps1').style.cssText = `right:-12%;bottom:-20%;width:62%;aspect-ratio:1;border-radius:50%;background:${css(s)}`;
  $('ps2').style.cssText = `left:7%;top:48%;width:34%;height:7%;background:${css(s)}`;
  $('ptitle').style.color = textOn(m);
  $('pbtn').style.background = css(a);
  $('pbtn').style.color = textOn(a);
  $('r1').style.background = css(m); $('r2').style.background = css(s); $('r3').style.background = css(a);
}

function drawLab() {
  const c = colors[2] || { h: base, s: 60, l: 55 };
  const h = c.h;
  let b1, b2, sq;
  if (lab === 'value') { sq = { h, s: 25, l: 50 }; b1 = { h, s: 10, l: 12 }; b2 = { h, s: 10, l: 92 }; }
  if (lab === 'chroma') { sq = { h, s: 45, l: 55 }; b1 = { h, s: 0, l: 55 }; b2 = { h, s: 95, l: 55 }; }
  if (lab === 'hue') { sq = { h, s: 75, l: 55 }; b1 = { h: h - 45, s: 80, l: 55 }; b2 = { h: h + 45, s: 80, l: 55 }; }
  if (lab === 'comp') { sq = { h, s: 70, l: 55 }; b1 = { h: h + 180, s: 65, l: 55 }; b2 = { h, s: 0, l: 55 }; }
  $('lb1').style.background = css(b1); $('lb2').style.background = css(b2);
  $('ls1').style.background = css(sq); $('ls2').style.background = css(sq); $('bridge').style.background = css(sq);
  $('lab-text').textContent = LAB[lab];
}

function seg(id, cb) {
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  });
}
seg('modes', v => { mode = v; generate(false); });
seg('seasons', v => { season = v; baseFixed = false; locked = locked.map(() => false); generate(true); });
seg('labs', v => { lab = v; drawLab(); });
$('bridge-on').onchange = e => $('bridge').classList.toggle('on', e.target.checked);
$('swap').onclick = () => { roleShift = (roleShift + 1) % 5; drawPoster(); };
const reroll = () => generate(!baseFixed && !locked.some(Boolean));
$('shuffle').onclick = reroll;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); reroll(); } });
generate(true);
</script>
</body>
</html>
