<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>붕어빵 시장: 수요와 공급</title>
<meta name="description" content="가격을 바꾸고 사건을 일으키며 균형 가격이 정해지는 과정을 보는 시뮬레이션">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --bg: #fdf8f1; --ink: #3a2c22; --muted: #8c7a6b; --line: #ede2d3; --d: #2f6fdf; --s: #e0662f; --eq: #1f9d6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; word-break: keep-all; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }
  .top a { font-size: 14px; color: var(--muted); text-decoration: none; }
  h1 { margin: 18px 0 6px; font-size: 34px; letter-spacing: -.03em; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; align-items: start; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .card + .card { margin-top: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 15px; }
  svg { width: 100%; display: block; user-select: none; }
  .price { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 14px; }
  .price input { flex: 1; accent-color: var(--ink); }
  .price b { font-size: 18px; min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; background: var(--ink); color: #fff; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .status { padding: 14px 16px; border-radius: 12px; font-size: 15px; line-height: 1.6; transition: background .3s; }
  .status b { display: block; font-size: 18px; margin-bottom: 2px; }
  .status.short { background: #e9f0fd; } .status.surplus { background: #fdeee6; } .status.eq { background: #e5f5ee; }
  .market { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .side { border: 1px dashed var(--line); border-radius: 12px; padding: 10px; min-height: 120px; }
  .side h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .side h3 span { color: var(--ink); font-variant-numeric: tabular-nums; }
  .icons { display: flex; flex-wrap: wrap; gap: 3px; }
  .icons svg { width: 22px; height: 26px; animation: in .35s ease; }
  @keyframes in { from { transform: scale(.3); opacity: 0; } }
  .events { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ev { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; font: inherit; cursor: pointer; transition: border-color .2s, transform .15s; }
  .ev:hover { border-color: var(--muted); transform: translateY(-1px); }
  .ev small { display: block; font-size: 12px; margin-top: 2px; font-weight: 700; }
  .ev.d small { color: var(--d); } .ev.s small { color: var(--s); }
  .ev span { font-size: 13.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
  .log { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.6; min-height: 20px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">← 포트폴리오로</a></div>
  <h1>붕어빵 시장: 수요와 공급</h1>
  <p class="sub">학교 앞 붕어빵 가게의 가격을 정해 보고, 시장이 균형 가격을 찾아가는 과정을 확인합니다.</p>
  <div class="layout">
    <div>
      <div class="card">
        <svg id="g" viewBox="0 0 640 460"></svg>
        <div class="price"><span>가격</span><input type="range" id="p" min="0" max="2400" step="50" value="1800"><b id="pv"></b></div>
        <div class="btns"><button class="btn" id="auto">시장에 맡기기</button><button class="btn ghost" id="reset">처음으로</button></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="status" id="status"></div>
        <div class="market">
          <div class="side"><h3>사려는 손님 <span id="qd"></span></h3><div class="icons" id="people"></div></div>
          <div class="side"><h3>팔려는 붕어빵 <span id="qs"></span></h3><div class="icons" id="bread"></div></div>
        </div>
      </div>
      <div class="card">
        <h2>사건 일으키기</h2>
        <div class="events" id="events"></div>
        <div class="log" id="log">사건을 누르면 곡선이 움직입니다. 그다음 <b>시장에 맡기기</b>로 새 균형을 찾아봅니다.</div>
      </div>
      <div class="card">
        <h2>균형 비교</h2>
        <table><tr><th></th><th>처음</th><th>지금</th></tr>
          <tr><td>균형 가격</td><td id="e0p"></td><td id="e1p"></td></tr>
          <tr><td>균형 거래량</td><td id="e0q"></td><td id="e1q"></td></tr></table>
      </div>
    </div>
  </div>
</div>
<script>
// 수요량 = d0 - 0.05 × 가격,  공급량 = s0 + 0.05 × 가격
const BASE = { d0: 120, s0: -10 }, K = 0.05;
const EVENTS = [
  { t: 'd', dd: 30, label: '수요 증가', text: '갑자기 추워져서 따뜻한 간식을 찾는 손님이 늘었습니다' },
  { t: 'd', dd: -30, label: '수요 감소', text: '바로 옆에 호떡 가게가 새로 생겼습니다 (대체재)' },
  { t: 's', ds: 25, label: '공급 증가', text: '사장님이 붕어빵 기계를 한 대 더 들여왔습니다' },
  { t: 's', ds: -25, label: '공급 감소', text: '팥과 밀가루 가격이 크게 올랐습니다 (생산비 증가)' }
];
const W = 640, H = 460, L = 64, B = 404, T = 42, Rr = 620, QMAX = 160, PMAX = 2400;
const X = q => L + q / QMAX * (Rr - L), Y = p => B - p / PMAX * (B - T);
const $ = id => document.getElementById(id);
let cur = { ...BASE }, prev = null, price = 1800, timer = null;

const qd = (p, c = cur) => Math.max(0, c.d0 - K * p);
const qs = (p, c = cur) => Math.max(0, c.s0 + K * p);
const eqOf = c => { const p = (c.d0 - c.s0) / (2 * K); return { p, q: c.d0 - K * p }; };

function curve(c, kind) {
  const pts = [];
  for (let p = 0; p <= PMAX; p += 50) {
    const q = kind === 'd' ? c.d0 - K * p : c.s0 + K * p;
    if (q >= 0 && q <= QMAX) pts.push(`${X(q).toFixed(1)},${Y(p).toFixed(1)}`);
  }
  return pts.join(' ');
}
function draw() {
  const e = eqOf(cur), d = qd(price), s = qs(price);
  let h = '';
  // 눈금
  for (let p = 0; p <= PMAX; p += 400) h += `<line x1="${L}" x2="${Rr}" y1="${Y(p)}" y2="${Y(p)}" stroke="#f1e8dc"/><text x="${L - 8}" y="${Y(p) + 4}" text-anchor="end" font-size="12" fill="#8c7a6b">${p.toLocaleString()}</text>`;
  for (let q = 0; q <= QMAX; q += 20) h += `<text x="${X(q)}" y="${B + 18}" text-anchor="middle" font-size="12" fill="#8c7a6b">${q}</text>`;
  h += `<line x1="${L}" x2="${Rr}" y1="${B}" y2="${B}" stroke="#3a2c22"/><line x1="${L}" x2="${L}" y1="${T}" y2="${B}" stroke="#3a2c22"/>`;
  h += `<text x="${Rr}" y="${B + 38}" text-anchor="end" font-size="13" fill="#3a2c22">수량 (개)</text><text x="${L - 50}" y="${T - 20}" font-size="13" fill="#3a2c22">가격 (원)</text>`;
  // 이전 곡선
  if (prev) {
    h += `<polyline points="${curve(prev, 'd')}" fill="none" stroke="#2f6fdf" stroke-opacity=".28" stroke-width="2.5" stroke-dasharray="6 5"/>`;
    h += `<polyline points="${curve(prev, 's')}" fill="none" stroke="#e0662f" stroke-opacity=".28" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  }
  // 곡선
  h += `<polyline points="${curve(cur, 'd')}" fill="none" stroke="#2f6fdf" stroke-width="3.5"/>`;
  h += `<polyline points="${curve(cur, 's')}" fill="none" stroke="#e0662f" stroke-width="3.5"/>`;
  const dl = Math.min(QMAX, cur.d0 - K * 2300), sl = cur.s0 + K * 2300;
  h += `<text x="${X(Math.max(4, dl)) + 6}" y="${Y(2300) + 4}" font-size="14" font-weight="700" fill="#2f6fdf">수요</text>`;
  h += `<text x="${X(Math.min(QMAX - 12, sl)) + 6}" y="${Y(2300) + 4}" font-size="14" font-weight="700" fill="#e0662f">공급</text>`;
  // 균형점 (점선 안내)
  h += `<line x1="${L}" x2="${X(e.q)}" y1="${Y(e.p)}" y2="${Y(e.p)}" stroke="#1f9d6b" stroke-dasharray="3 4"/><line x1="${X(e.q)}" x2="${X(e.q)}" y1="${Y(e.p)}" y2="${B}" stroke="#1f9d6b" stroke-dasharray="3 4"/>`;
  h += `<circle cx="${X(e.q)}" cy="${Y(e.p)}" r="6" fill="#1f9d6b"/><text x="${X(e.q) + 10}" y="${Y(e.p) - 10}" font-size="13" font-weight="700" fill="#1f9d6b">균형</text>`;
  // 현재 가격선과 초과량
  const y = Y(price), gap = d - s;
  h += `<line x1="${L}" x2="${Rr}" y1="${y}" y2="${y}" stroke="#3a2c22" stroke-width="1.5"/>`;
  if (Math.abs(gap) >= 1) {
    const col = gap > 0 ? '#2f6fdf' : '#e0662f';
    h += `<rect x="${X(Math.min(d, s))}" y="${y - 7}" width="${Math.abs(X(d) - X(s))}" height="14" rx="7" fill="${col}" fill-opacity=".18"/>`;
    h += `<text x="${(X(d) + X(s)) / 2}" y="${y - 14}" text-anchor="middle" font-size="13" font-weight="700" fill="${col}">${gap > 0 ? '초과 수요' : '초과 공급'} ${Math.round(Math.abs(gap))}개</text>`;
  }
  h += `<circle cx="${X(d)}" cy="${y}" r="5.5" fill="#fff" stroke="#2f6fdf" stroke-width="3"/><circle cx="${X(s)}" cy="${y}" r="5.5" fill="#fff" stroke="#e0662f" stroke-width="3"/>`;
  h += `<rect id="hit" x="${L}" y="${T}" width="${Rr - L}" height="${B - T}" fill="transparent" style="cursor:ns-resize"/>`;
  $('g').innerHTML = h;
  $('g').querySelector('#hit').onpointerdown = drag;

  // 오른쪽 상태
  $('pv').textContent = price.toLocaleString() + '원';
  $('p').value = price;
  $('qd').textContent = Math.round(d) + '개'; $('qs').textContent = Math.round(s) + '개';
  icons('people', Math.round(d / 8), person); icons('bread', Math.round(s / 8), fish);
  const st = $('status');
  if (Math.abs(gap) < 1) { st.className = 'status eq'; st.innerHTML = '<b>균형 상태</b>사려는 양과 팔려는 양이 같습니다. 가격이 더 이상 움직이지 않습니다.'; }
  else if (gap > 0) { st.className = 'status short'; st.innerHTML = `<b>붕어빵이 ${Math.round(gap)}개 모자랍니다</b>사려는 손님이 더 많아 줄이 길어집니다. 사장님은 가격을 올립니다.`; }
  else { st.className = 'status surplus'; st.innerHTML = `<b>붕어빵이 ${Math.round(-gap)}개 남습니다</b>팔리지 않은 붕어빵이 쌓입니다. 사장님은 가격을 내립니다.`; }
  const e0 = eqOf(BASE);
  $('e0p').textContent = Math.round(e0.p).toLocaleString() + '원'; $('e0q').textContent = Math.round(e0.q) + '개';
  $('e1p').textContent = Math.round(e.p).toLocaleString() + '원'; $('e1q').textContent = Math.round(e.q) + '개';
}
const person = '<svg viewBox="0 0 22 26"><circle cx="11" cy="7" r="5" fill="#2f6fdf"/><path d="M2 25c0-6 4-10 9-10s9 4 9 10z" fill="#2f6fdf" fill-opacity=".75"/></svg>';
const fish = '<svg viewBox="0 0 22 26"><path d="M2 13c3-6 10-7 15-3l4-4v14l-4-4c-5 4-12 3-15-3z" fill="#d79a4a"/><circle cx="7" cy="12" r="1.3" fill="#5a3b1c"/><path d="M10 9c1 2 1 6 0 8M13 9.5c1 2 1 5 0 7" stroke="#b5762e" stroke-width="1" fill="none"/></svg>';
const shown = { people: 0, bread: 0 };
function icons(id, n, svg) {
  n = Math.min(n, 20);
  const box = $(id);
  while (box.children.length > n) box.lastChild.remove();
  while (box.children.length < n) box.insertAdjacentHTML('beforeend', svg);
}
function drag(e) {
  stop();
  const svg = $('g'), r = svg.getBoundingClientRect();
  const move = ev => {
    const yy = (ev.clientY - r.top) / r.height * H;
    price = Math.round(Math.max(0, Math.min(PMAX, (B - yy) / (B - T) * PMAX)) / 50) * 50;
    draw();
  };
  move(e);
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
function stop() { clearInterval(timer); timer = null; $('auto').textContent = '시장에 맡기기'; }
$('p').oninput = e => { stop(); price = +e.target.value; draw(); };
$('auto').onclick = () => {
  if (timer) { stop(); return; }
  $('auto').textContent = '멈추기';
  timer = setInterval(() => {
    const gap = qd(price) - qs(price);
    if (Math.abs(gap) < 1) { price = Math.round(eqOf(cur).p); draw(); stop(); return; }
    price = Math.max(0, Math.min(PMAX, Math.round(price + gap * 4)));
    draw();
  }, 140);
};
$('reset').onclick = () => { stop(); cur = { ...BASE }; prev = null; price = 1800; $('log').innerHTML = '사건을 누르면 곡선이 움직입니다. 그다음 <b>시장에 맡기기</b>로 새 균형을 찾아봅니다.'; draw(); };
EVENTS.forEach(ev => {
  const b = document.createElement('button');
  b.className = 'ev ' + ev.t;
  b.innerHTML = `<span>${ev.text}</span><small>${ev.label} →</small>`;
  b.onclick = () => {
    stop();
    prev = { ...cur };
    const to = { d0: cur.d0 + (ev.dd || 0), s0: cur.s0 + (ev.ds || 0) };
    to.d0 = Math.max(60, Math.min(180, to.d0)); to.s0 = Math.max(-60, Math.min(40, to.s0));
    // 곡선이 부드럽게 이동
    const from = { ...cur }, t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - k, 3);
      cur = { d0: from.d0 + (to.d0 - from.d0) * e, s0: from.s0 + (to.s0 - from.s0) * e };
      draw();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
    const e0 = eqOf(from), e1 = eqOf(to);
    $('log').innerHTML = `<b>${ev.label}</b>: ${ev.t === 'd' ? '수요 곡선' : '공급 곡선'}이 ${(ev.dd || ev.ds) > 0 ? '오른쪽' : '왼쪽'}으로 이동했습니다. 균형 가격은 ${Math.round(e0.p).toLocaleString()}원에서 ${e1.p > e0.p ? '오를' : '내릴'} 것입니다. <b>시장에 맡기기</b>로 확인해 봅니다.`;
  };
  $('events').appendChild(b);
});
draw();
</script>
</body>
</html>
